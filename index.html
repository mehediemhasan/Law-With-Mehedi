<style>

.ic{padding:4px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.st{background:#0c1430;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}

.cour{width:100%;max-height:200px;margin:6px 0}
.door{text-align:left;border-radius:60px 60px 12px 12px/34px 34px 12px 12px;padding:18px 14px 14px;background:linear-gradient(180deg,#1a2a5a,#0e1738);border:1px solid var(--gold)}
.door .em{font-size:30px}.door h3{font-size:21px;color:var(--gold)}
.q{font-size:20px;font-weight:500;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px}
.opt.ok{border-color:var(--ok);background:rgba(76,175,125,.18)}.opt.bad{border-color:var(--bad);background:rgba(224,89,106,.18)}
.opt.sel{border-color:var(--gold);background:rgba(201,162,75,.16)}
.exp{border-left:3px solid var(--gold);background:#0c1430;padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.tm{color:var(--gold);font-weight:600;font-size:18px}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav button{padding:6px 0;font-size:13px}.nav .an{background:#3a2f12;border-color:var(--gold)}.nav .mk{background:var(--wine)}.nav .cu{outline:2px solid var(--iv)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:10px 18px;border-radius:30px;font-weight:600;z-index:20;animation:pop 2.6s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pt{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.35;animation:fl 14s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
@media(prefers-reduced-motion:reduce){.pt{display:none}*{transition:none!important}}
</style>
</head>
